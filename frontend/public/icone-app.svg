<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <title>AnamneLab — ícone do app</title>
  <defs>
    <mask id="corte-tras" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"></rect>
      <g fill="#000" stroke="#000" stroke-width="6" stroke-linejoin="round">
        <rect x="20" y="22" width="40" height="30" rx="11"></rect>
