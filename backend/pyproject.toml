[project]
name = "anamnelab-backend"
version = "0.1.0"
description = "Backend do protótipo AnamneLab: transcrição, anamnese estruturada e correção por checklist."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "anthropic",
    "httpx",
]

[project.optional-dependencies]
# Transcrição local com Whisper (TRANSCRICAO=local). O av 17+ quebra o faster-whisper 1.2
# ("unexpected keyword argument 'metadata_errors'").
local = ["faster-whisper", "av<17"]
# Transcrição pela API whisper-1 (TRANSCRICAO=api).
api = ["openai"]
# Voz do paciente pela IA: Edge (VOZ_PACIENTE=edge) ou Piper (VOZ_PACIENTE=piper).
voz = ["edge-tts", "piper-tts"]
# Banco e login no Supabase (BANCO=supabase, AUTH=supabase).
supabase = ["supabase"]
dev = ["pytest", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]

[tool.ruff.format]
# Os contratos em app/schemas/ ficam como foram escritos.
exclude = ["app/schemas/*"]
